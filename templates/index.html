<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-position: center;
            background-color: #f4f4f4;
            color: #2941b9;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }


        footer {
            text-align: center;
            margin-top: 20px;
        }

        .b1 {
            display: inline-block;
            margin: 0 10px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #2941b9;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .b1:hover {
            background-color: #2980b9;
        }

        main {
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <h1>Welcome to the LibraTrack</h1>
        <p>Explore and manage your library resources with ease.</p>
    </header>

    <main>
        <section>
            <h2>Get Started</h2>
            <button class="b1" onclick="window.location.href='/register'">Register</button>
            <button class="b1" onclick="window.location.href='/user-login'">Login</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Library Management System</p>
    </footer>
</body>

</html>
