<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <style>
        body {
            font-family: 'Raleway', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            color: #2941b9;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 300px;
        }

        label {
            margin-bottom: 10px;
        }

        input {
            padding: 10px;
            margin-bottom: 10px;
            width: 300px;
            border-radius: 15px;
            border-style: none;
        }

        button {
            padding: 10px;
            background-color: #2941b9;
            color: #fff;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            width: 150px;
        }

        button:hover {
            background-color: #21618c;
        }
    </style>
</head>

<body>
    <h1>User Login</h1>
    {% if message %}
    <p style="color: red; margin-bottom: 10px;">{{ message }}</p>
    {% endif %}
    <form method="post">
        <label for="userId">User ID:</label>
        <input type="text" id="userId" name="user_id" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Login</button>
    </form>
    <p style="margin-top: 20px;">Don't have an account? <a href="/register">Register here</a>.</p>
</body>

</html>
